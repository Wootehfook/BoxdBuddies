# AI Generated: GPT-5.2-Codex - 2026-02-15
name: Deploy TMDB Cron Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/tmdb-cron/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: workers/tmdb-cron/package-lock.json

      - name: Install dependencies
        working-directory: workers/tmdb-cron
        run: npm ci --ignore-scripts

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/tmdb-cron
          command: deploy
